<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personality Quiz</title>
    <link rel="icon" type="image/x-icon" href="/img/ideas.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href ="./css/style.css">
</head>
<body>
    <h1 class="text-center mt-4">What Type of Weekend Person Are You?</h1>
    
    <!-- Start quiz element -->
    <div class="container d-flex justify-content-center" id="question-1">
      <div class="card my-4 p-4 question-block" style="width: 75%;">
        <h4 class="mb-3">1. Where is your dream living place?</h4>
        <div class="row g-2">
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-answer="A">By the beach, with surfing A</button>
          </div>
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-answer="B">By the moutains, with skiing B</button>
          </div>
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-answer="C">In the city, with city life C</button>
          </div>
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-answer="D">On the countryside, with nobody around D</button>
          </div>
        </div>
      </div>
    </div>

    
    
    <!-- End quiz element -->

    <!-- Add more quiz elements here -->

<div class="container d-flex justify-content-center" id="question-2">
  <div class="card my-4 p-4 question-block" style="width: 75%;">
    <h4 class="mb-3">2. Pick a favorite drink.</h4>
    <div class="row g-2">
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="adventure">Iced coffee</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="cozy">Hot chocolate at home</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="adventure">Fresh smoothie</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="cozy">Warm tea in a mug</button>
      </div>
    </div>
  </div>
</div>

<div class="container d-flex justify-content-center" id="question-3">
  <div class="card my-4 p-4 question-block" style="width: 75%;">
    <h4 class="mb-3">3. What sounds most fun at night?</h4>
    <div class="row g-2">
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="adventure">Chilling with friends</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="cozy">Watching shows</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="adventure">Meeting friends downtown</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="cozy">Baking cookies at home</button>
      </div>
    </div>
  </div>
</div>

<div class="container d-flex justify-content-center" id="question-4">
  <div class="card my-4 p-4 question-block" style="width: 75%;">
    <h4 class="mb-3">4. Choose a vacation.</h4>
    <div class="row g-2">
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="adventure">A road trip with friends</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="cozy">A quiet cabin retreat</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="adventure">Backpacking somewhere new</button>
      </div>
      <div class="col-6">
        <button class="btn btn-outline-primary w-100 answer-btn" data-answer="cozy">A relaxing staycation</button>
      </div>
    </div>
  </div>
</div>

    <div class="container d-flex justify-content-center">
      <button id="show-result" class="btn btn-success my-4">Show Results</button>
    </div>    
    <!-- Output the result here -->
    <div class="container d-flex justify-content-center">
      <div id="result-container" class="card p-4 mb-4" style="width: 75%; display: none;">
        <h3>Your Result:</h3>
        <p id="result-text"></p>
      </div>
    </div>
    
    <!-- Connect to your script file here -->
     <script src = "./js/script.js"></script>
</body>
</html>
